/* VOICE: joyeux et doux, zéro pression : un carnet de jeu
   IDEA: carnet lilas le jour (B), tableau de score de nuit (C), disposition du vestiaire (A)
   PICTURE: la semaine elle-même, cartes arrondies, heures en gros chiffres
   COLOUR+TYPE: lilas #f2efff / violet #5b3fd6 le jour, nuit #120f24 / jaune balle #dff24a ; Nunito + Space Grotesk pour les chiffres
   LAYOUT: chiffres en haut, onglets, semaine jour par jour avec « + », prochaines fois dessous */
:root{color-scheme:light dark;--bg:light-dark(#f2efff,#120f24);--card:light-dark(#ffffff,#1d1936);--soft:light-dark(#e9e4ff,#262046);--ink:light-dark(#2b2350,#f1eeff);--mute:light-dark(#625a88,#aaa4cc);--line:light-dark(#e2dcff,#2f2952);--acc:light-dark(#5b3fd6,#9a88ff);--num:light-dark(#5b3fd6,#dff24a);--ball:#dff24a;--onacc:light-dark(#ffffff,#120f24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
.g{font-family:'Space Grotesk',Nunito,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,14px)}
header{padding-top:clamp(20px,4vw,36px)}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hello small{display:block;color:var(--mute);font-weight:700;font-size:14px}
h1{margin:0;font-size:clamp(30px,6vw,40px);line-height:1.05;font-weight:900}
.plus{width:52px;height:52px;border:0;border-radius:18px;background:var(--acc);color:var(--onacc);font-size:28px;font-weight:800;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{background:var(--card);border-radius:18px;padding:12px 14px}
.stat b{display:block;font:700 clamp(22px,5vw,30px)/1.1 'Space Grotesk',sans-serif;white-space:nowrap}
.stat.hi b{color:var(--num)}
.stat span{font-size:13px;color:var(--mute);font-weight:700}
.budbar{height:10px;border-radius:5px;background:var(--soft);display:flex;overflow:hidden;margin-top:10px}
.budbar i{display:block;height:100%;background:var(--c)}
.tabs{display:flex;gap:6px;margin:18px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;color:var(--mute);font-weight:800;padding:10px 16px;border-radius:99px;min-height:44px;white-space:nowrap;flex:none}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
main{padding-bottom:70px}
h2{font-size:24px;font-weight:900;margin:30px 0 10px;line-height:1.1}
.nav{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.nav .lbl{flex:1;display:flex;flex-direction:column}
.nav .lbl b{font-size:22px;font-weight:900;line-height:1.1}
.nav .lbl span{color:var(--mute);font-size:14px;font-weight:700}
.rb{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-weight:800}
.rb.go{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.rb.yl{background:var(--ball);border-color:var(--ball);color:#120f24}
.rb.del{color:#e0384b}
.days{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start}
.dl{padding-top:8px;display:flex;flex-direction:column;align-items:flex-start}
.dl span{font-size:13px;font-weight:900;color:var(--mute);letter-spacing:.02em}
.dl b{font:700 24px/1.05 'Space Grotesk',sans-serif;padding:0 5px;margin-left:-5px;border-radius:8px}
.today .dl b{background:var(--ball);color:#120f24}
.its{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:18px;padding:10px 12px;min-height:60px}
.av{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;font-weight:900;font-size:14px;background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--ink)}
.av::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c);position:absolute;opacity:0}
.it{flex:1;display:flex;flex-direction:column;line-height:1.3}
.it b{font-size:16px;font-weight:800}
.it span{font-size:13px;color:var(--mute);font-weight:600}
.it em{font-style:normal;font-size:12px;font-weight:900;color:var(--c)}
.tm{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.tm b{font:700 18px/1.1 'Space Grotesk',sans-serif}
.tm span{font:500 13px 'Space Grotesk',sans-serif;color:var(--mute);white-space:nowrap}
.item.essai{outline:2px dashed var(--c);outline-offset:-2px}
.item.done{opacity:.55}.item.done .it b{text-decoration:line-through}
.pause{font-size:14px;color:var(--mute);padding:8px 4px;font-weight:700}
.add{min-height:44px;border:1.5px dashed var(--line);background:transparent;border-radius:14px;color:var(--mute);font-weight:800;text-align:left;padding:0 14px}
.add.sm{align-self:flex-start;min-width:44px;padding:0 14px;text-align:center}
.flex{margin-top:14px;padding:14px;background:var(--soft);border-radius:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flex>span{font-weight:900;margin-right:4px}
.fx{border:0;border-radius:99px;padding:8px 14px;min-height:44px;background:var(--card);font-weight:800}
.fx.ok{background:var(--acc);color:var(--onacc)}
.next{background:var(--card);border-radius:18px;padding:6px 14px}
.next div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.next div:last-child{border:0}
.next b{font-weight:800}.next span{color:var(--num);font:700 14px 'Space Grotesk',sans-serif;text-align:right}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);margin-right:8px;flex:none}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mh{font-size:12px;font-weight:900;color:var(--mute);text-align:center;padding:4px 0}
.cell{min-height:92px;background:var(--card);border-radius:12px;padding:5px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left}
.cell.out{opacity:.35}
.cell .n{font:700 14px 'Space Grotesk',sans-serif;align-self:flex-start;padding:0 5px;border-radius:6px}
.cell.today .n{background:var(--ball);color:#120f24}
.mc{font-size:12px;font-weight:800;line-height:1.25;padding:2px 5px;border-radius:6px;background:color-mix(in srgb,var(--c) 24%,var(--card));overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mc.done{opacity:.5;text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--mute);font-weight:700}
.bud{display:grid;gap:9px;background:var(--card);border-radius:18px;padding:14px}
.row{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) auto;gap:12px;align-items:center;font-weight:700}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:5px}
.v{font:700 15px 'Space Grotesk',sans-serif;white-space:nowrap;text-align:right}
.total{font:700 38px/1 'Space Grotesk',sans-serif;color:var(--num);margin:0}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:18px;overflow:hidden}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap;font-family:'Space Grotesk',sans-serif}
.soon{font-weight:800;color:var(--num)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.card h4{margin:0;font-size:19px;font-weight:900;display:flex;align-items:center}
.pill{font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--soft);align-self:flex-start;white-space:nowrap}
.meta{color:var(--mute);font-size:14px;font-weight:600}
.card .rb{margin-top:6px;align-self:flex-start}
.seq{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.seq span{font-size:13px;font-weight:800;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 24%,var(--card))}
.todo{list-style:none;padding:4px 14px;margin:0;background:var(--card);border-radius:18px}
.todo li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border:0}
.todo li.ok span{text-decoration:line-through;color:var(--mute)}
.todo span{flex:1;font-weight:700}
.line{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input,select,textarea{font:16px Nunito,sans-serif;font-weight:700;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:14px;min-height:46px;padding:8px 12px;width:100%}
textarea{min-height:70px}
input[type=checkbox]{width:24px;min-height:24px;accent-color:var(--acc);flex:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgb(10 8 24/.6);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:10px}
.sheet[hidden]{display:none}
.panel{background:var(--card);border-radius:24px;padding:18px;width:min(540px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:24px;font-weight:900;line-height:1.1}
.panel h3 small{display:block;font-size:14px;color:var(--mute);font-weight:700}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800}
.panel [hidden]{display:none!important}
fieldset{border:0;padding:0;margin:0}legend{font-size:13px;font-weight:800;margin-bottom:6px;padding:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;border-radius:99px;padding:8px 14px;min-height:44px;background:var(--soft);font-weight:800}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.chips button.idea{background:transparent;border:1.5px dashed var(--line)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.panel .pick label{position:relative;flex-direction:row}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick span{display:grid;place-items:center;min-width:46px;min-height:44px;background:var(--soft);border-radius:12px;font-weight:800;padding:0 10px}
.pick input:checked+span{background:var(--acc);color:var(--onacc)}
.pick i{display:block;width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.pick input:checked+i{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.pick input:focus-visible+span,.pick input:focus-visible+i{outline:3px solid var(--acc);outline-offset:2px}
.steps{display:grid;gap:6px}.steps div{display:flex;gap:6px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.stack-b{display:flex;flex-direction:column;gap:8px}.stack-b .rb{width:100%;min-height:50px;text-align:left}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--soft);border-radius:14px;padding:8px 10px}
.facts b{display:block;font:700 18px 'Space Grotesk',sans-serif}.facts span{font-size:12px;color:var(--mute);font-weight:800}
.err{color:#e0384b;font-size:14px;margin:0;font-weight:700}
@media(min-width:700px){.sheet{align-items:center}}
@media(max-width:600px){.cell{min-height:58px;padding:3px}.mc{height:7px;padding:0;font-size:0;background:var(--c)}.row{grid-template-columns:minmax(0,100px) minmax(0,1fr) auto}.stack thead{display:none}.stack tr{display:grid;padding:10px 12px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:13px;font-family:Nunito,sans-serif;font-weight:800}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.item,.fx{transition:transform .15s}.item:active,.fx:active{transform:scale(.97)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="wrap">
<header>
  <div class="hello"><div><small>Que du plaisir, zéro obligation</small><h1>Mon planning fun</h1></div><button class="plus" data-addday="" aria-label="Ajouter une activité">+</button></div>
  <div id="stats"></div>
  <nav class="tabs" role="tablist">
    <button data-tab="week" aria-selected="true">Semaine</button>
    <button data-tab="month" aria-selected="false">Mois</button>
    <button data-tab="next" aria-selected="false">Prochaines fois</button>
    <button data-tab="acts" aria-selected="false">Mes activités</button>
  </nav>
</header>
<main id="view"></main>
</div>
<div class="sheet" id="sheet" hidden><form class="panel" id="form" novalidate></form></div>
<script>
{
const COLORS=['#5b3fd6','#ff6a45','#1fb487','#f0a800','#38b6e8','#ff4f9a','#8a5cff','#7f9a00','#d4682a','#5a6290'];
const SEED={v:2,acts:[],rots:[],events:[],skip:{},todo:[],done:{},flexDone:{}};
const fix=s=>{s.done=s.done||{};s.flexDone=s.flexDone||{};s.todo=s.todo||[];s.rots=s.rots||[];s.events=s.events||[];s.skip=s.skip||{};s.acts.forEach(a=>{if(a.place==null)a.place=''});return s};
let S=null;
try{const raw=localStorage.getItem('planningFun');if(raw)S=JSON.parse(raw)}catch(e){}
if(!S||!Array.isArray(S.acts))S=JSON.parse(JSON.stringify(SEED));
fix(S);
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wd=d=>(d.getDay()+6)%7;
const monday=d=>addD(d,-wd(d));
const diff=(a,b)=>Math.round((b-a)/864e5);
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYSL=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmt=d=>d.getDate()+' '+MON[d.getMonth()];
const fmtL=d=>DAYSL[wd(d)]+' '+d.getDate()+' '+MONL[d.getMonth()];
const eur=n=>(Math.round(n*100)/100).toLocaleString('fr-FR')+' €';
const okP=p=>p!==''&&p!=null&&!isNaN(+p);
const pTxt=p=>!okP(p)?'':+p===0?'gratuit':eur(+p);
const ord=n=>n===1?'1er':n+'e';
const byId=id=>S.acts.find(a=>a.id===id);
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const ini=n=>{const w=String(n).replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'').split(' ').filter(Boolean);if(!w.length)return '?';return w.length>1?(w[0][0]+w[1][0]).toUpperCase():w[0][0].toUpperCase()+w[0].slice(1,2).toLowerCase()};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function nthWd(y,m,w,n){const f=new Date(y,m,1);let d=1+((w-wd(f)+7)%7)+7*(n-1);const last=new Date(y,m+1,0).getDate();if(d>last)d-=7;return new Date(y,m,d)}
function mk(a,d,extra){const o={d,a,key:a.id+'|'+d,time:a.time,place:a.place,price:a.price};return Object.assign(o,extra||{})}
function occ(from,to){
  const out=[];
  for(const a of S.acts){
    if(a.status==='idee')continue;const r=a.rule||{};
    if(r.type==='weekly'&&r.start&&(r.days||[]).length){
      const st=parse(r.start),m0=monday(st),ev=r.every||1;
      for(let d=new Date(from);d<=to;d=addD(d,1)){if(d<st||!r.days.includes(wd(d)))continue;const w=Math.round(diff(m0,monday(d))/7);if(w%ev===0)out.push(mk(a,iso(d)))}
    }else if(r.type==='monthly'&&r.start){
      const st=parse(r.start),n=Math.ceil(st.getDate()/7),w=wd(st),ev=r.every||1;
      const cnt=(to.getFullYear()-from.getFullYear())*12+to.getMonth()-from.getMonth();
      for(let k=0;k<=cnt;k++){const y=from.getFullYear()+Math.floor((from.getMonth()+k)/12),m=(from.getMonth()+k)%12;const dm=(y-st.getFullYear())*12+m-st.getMonth();if(dm<0||dm%ev)continue;const d=nthWd(y,m,w,n);if(d>=from&&d<=to&&d>=st)out.push(mk(a,iso(d)))}
    }else if(r.type==='once'&&r.date){const d=parse(r.date);if(d>=from&&d<=to)out.push(mk(a,r.date))}
  }
  for(const ro of S.rots){
    if(!ro.start||!ro.items.length)continue;const st=parse(ro.start),m0=monday(st),ev=ro.every||1;
    for(let d=new Date(from);d<=to;d=addD(d,1)){
      if(d<st||wd(d)!==+ro.day)continue;const w=Math.round(diff(m0,monday(d))/7);if(w%ev)continue;
      const id=ro.items[(w/ev)%ro.items.length],a=byId(id);
      if(id==='pause')out.push({d:iso(d),pause:true,rot:ro,key:'p|'+ro.id+'|'+iso(d)});else if(a&&a.status!=='idee')out.push(mk(a,iso(d),{rot:ro}));
    }
  }
  for(const e of S.events){const a=byId(e.act);if(!a)continue;const d=parse(e.date);if(d>=from&&d<=to)out.push({d:e.date,a,ev:e,key:'e:'+e.id,time:e.time||a.time,place:e.place||a.place,price:okP(e.price)?e.price:a.price})}
  return out.filter(o=>!S.skip[o.key]).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:((x.time||'99')<(y.time||'99')?-1:1));
}
const real=l=>l.filter(o=>!o.pause);
const cost=l=>l.reduce((s,o)=>s+(o.a&&okP(o.price)?+o.price:0),0);
const flexActs=()=>S.acts.filter(a=>a.status!=='idee'&&a.rule&&a.rule.type==='flex');
const flexCost=()=>flexActs().reduce((s,a)=>s+(okP(a.price)?+a.price*(a.rule.per||1):0),0);
function ruleText(a){
  const r=a.rule||{};if(a.status==='idee')return 'Idée, pas encore planifié';
  if(r.type==='weekly'){const ds=(r.days||[]).map(i=>DAYSL[i]).join(' et ')||'?';return r.every>1?`Un ${ds} sur ${r.every}`:`Chaque ${ds}`}
  if(r.type==='monthly'){const st=parse(r.start);return `Tous les ${r.every>1?r.every+' ':''}mois, le ${ord(Math.ceil(st.getDate()/7))} ${DAYSL[wd(st)]}`}
  if(r.type==='flex')return `${r.per||1} fois par mois, quand je veux`;
  if(r.type==='once')return r.date?'Le '+fmtL(parse(r.date)):'Une fois';
  const ro=S.rots.find(x=>x.items.includes(a.id));const n=S.events.filter(e=>e.act===a.id).length;
  return ro?`Via la rotation « ${ro.name} »`:n?`${n} date${n>1?'s':''} ajoutée${n>1?'s':''} à la main`:'Pas de date fixe, ajoute-la quand tu veux';
}
function inDays(n){return n===0?"aujourd'hui":n===1?'demain':n<14?`dans ${n} j`:n<45?`dans ${Math.round(n/7)} sem.`:`dans ~${Math.round(n/30)} mois`}

let view='week',wk=monday(today()),mc=new Date(today().getFullYear(),today().getMonth(),1);
function item(o){
  if(o.pause)return `<div class="pause">Pause · ${esc(o.rot.name)}</div>`;
  const a=o.a,done=!!S.done[o.key];
  const sub=[o.place,o.rot?'rotation':'',o.ev?'juste cette fois':''].filter(Boolean).map(esc).join(' · ');
  return `<button class="item${a.status==='essai'?' essai':''}${done?' done':''}" style="--c:${esc(a.color)}" data-o="${esc(o.key)}" data-d="${esc(o.d)}"><span class="av">${done?'✓':esc(ini(a.name))}</span><span class="it"><b>${esc(a.name)}</b>${sub?`<span>${sub}</span>`:''}${a.status==='essai'?'<em>À tester</em>':''}</span><span class="tm">${o.time?`<b>${esc(o.time)}</b>`:''}${okP(o.price)?`<span>${esc(pTxt(o.price))}</span>`:''}</span></button>`;
}
function flexBox(d){
  const f=flexActs();if(!f.length)return '';const k=mkey(d);
  return `<div class="flex"><span>À caser en ${MONL[d.getMonth()]}</span>${f.map(a=>{const n=S.flexDone[a.id+'|'+k]||0,per=a.rule.per||1;return `<button class="fx${n>=per?' ok':''}" data-flex="${esc(a.id+'|'+k)}">${n>=per?'✓ ':''}${esc(a.name)} · ${n}/${per}</button>`}).join('')}</div>`;
}
function renderStats(){
  const t=today(),ws=monday(t),wl=real(occ(ws,addD(ws,6)));
  const m1=new Date(t.getFullYear(),t.getMonth(),1),m2=new Date(t.getFullYear(),t.getMonth()+1,0),ml=real(occ(m1,m2));
  const spent=cost(ml.filter(o=>parse(o.d)<=t))+flexActs().reduce((s,a)=>s+(okP(a.price)?+a.price*(S.flexDone[a.id+'|'+mkey(t)]||0):0),0);
  const plan=cost(ml)+flexCost();
  const by={};ml.forEach(o=>{if(okP(o.price)&&+o.price>0)by[o.a.id]=(by[o.a.id]||0)+ +o.price});
  const segs=Object.entries(by).map(([id,v])=>`<i style="--c:${esc(byId(id).color)};width:${(v/Math.max(plan,1)*100).toFixed(1)}%"></i>`).join('');
  $('#stats').innerHTML=`<div class="stats"><div class="stat hi"><b>${esc(eur(spent))}</b><span>dépensé en ${MONL[t.getMonth()]}</span></div><div class="stat"><b>${esc(eur(plan))}</b><span>prévu ce mois</span></div><div class="stat"><b>${esc(eur(cost(wl)))}</b><span>cette semaine</span></div></div>${segs?`<div class="budbar" aria-hidden="true">${segs}</div>`:''}`;
}
function nextList(n){
  const t=today(),l=real(occ(t,addD(t,420))).filter(o=>!S.done[o.key]),seen=new Set(),out=[];
  for(const o of l){if(seen.has(o.a.id))continue;seen.add(o.a.id);out.push(o);if(out.length>=n)break}
  return out;
}
function renderWeek(){
  const we=addD(wk,6),list=occ(wk,we),t=iso(today()),r=real(list);
  let h=`<div class="nav"><button class="rb" data-nav="-1" aria-label="Semaine précédente">‹</button><div class="lbl"><b>${fmt(wk)} – ${fmt(we)}</b><span>${r.length} activité${r.length>1?'s':''} · ${esc(eur(cost(r)))}</span></div><button class="rb" data-nav="0">Auj.</button><button class="rb" data-nav="1" aria-label="Semaine suivante">›</button></div><div class="days">`;
  for(let i=0;i<7;i++){const d=addD(wk,i),k=iso(d),its=list.filter(o=>o.d===k);
    h+=`<div class="drow${k===t?' today':''}"><div class="dl"><span>${DAYS[i].toUpperCase()}</span><b>${d.getDate()}</b></div><div class="its">${its.map(item).join('')}${its.length?`<button class="add sm" data-addday="${k}" aria-label="Ajouter le ${esc(fmtL(d))}">+</button>`:`<button class="add" data-addday="${k}">+ Ajouter ce jour-là</button>`}</div></div>`}
  h+=`</div>${flexBox(addD(wk,3))}`;
  const nx=nextList(5);
  if(nx.length)h+=`<h2>Prochaines fois</h2><div class="next">${nx.map(o=>`<div><b><i class="dot" style="--c:${esc(o.a.color)}"></i>${esc(o.a.name)}</b><span>${esc(DAYS[wd(parse(o.d))].toLowerCase()+' '+fmt(parse(o.d)))} · ${esc(inDays(diff(today(),parse(o.d))))}</span></div>`).join('')}</div>`;
  h+=S.acts.length?`<p class="hint">Touche une activité pour la cocher, la modifier ou la retirer.</p>`:`<p class="hint">Ton planning est vide. Appuie sur « + » un jour pour ajouter une activité, ou restaure ta sauvegarde dans « Mes activités ».</p>`;
  $('#view').innerHTML=h;
}
function renderMonth(){
  const y=mc.getFullYear(),m=mc.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),gs=monday(first),ge=addD(monday(last),6),list=real(occ(gs,ge)),t=iso(today());
  let h=`<div class="nav"><button class="rb" data-mnav="-1" aria-label="Mois précédent">‹</button><div class="lbl"><b>${MONL[m]} ${y}</b><span>Touche un jour pour y ajouter quelque chose</span></div><button class="rb" data-mnav="0">Auj.</button><button class="rb" data-mnav="1" aria-label="Mois suivant">›</button></div><div class="mgrid">${DAYS.map(d=>`<div class="mh">${d}</div>`).join('')}`;
  for(let d=new Date(gs);d<=ge;d=addD(d,1)){const k=iso(d),its=list.filter(o=>o.d===k);
    h+=`<button class="cell${d.getMonth()!==m?' out':''}${k===t?' today':''}" data-addday="${k}" aria-label="${esc(fmtL(d))}"><span class="n">${d.getDate()}</span>${its.map(o=>`<span class="mc${S.done[o.key]?' done':''}" style="--c:${esc(o.a.color)}">${esc(o.a.name)}</span>`).join('')}</button>`}
  h+='</div>';
  const inM=list.filter(o=>parse(o.d).getMonth()===m),used=[...new Set(inM.map(o=>o.a))];
  h+=`<div class="legend">${used.map(a=>`<span><i class="dot" style="--c:${esc(a.color)}"></i>${esc(a.name)}</span>`).join('')}</div>${flexBox(first)}`;
  const rows=used.map(a=>{const l=inM.filter(o=>o.a===a);return {a,n:l.length,v:cost(l),known:l.some(o=>okP(o.price))}});
  flexActs().forEach(a=>rows.push({a,n:a.rule.per||1,v:okP(a.price)?(a.rule.per||1)*a.price:0,known:okP(a.price)}));
  const tot=rows.reduce((s,r)=>s+r.v,0),mx=Math.max(1,...rows.map(r=>r.v));
  h+=`<h2>Budget de ${MONL[m]}</h2><p class="total">${esc(eur(tot))}</p><p class="hint" style="margin-bottom:12px">Hors activités sans prix renseigné.</p><div class="bud">${rows.sort((a,b)=>b.v-a.v).map(r=>`<div class="row" style="--c:${esc(r.a.color)}"><span>${esc(r.a.name)} <span class="meta">× ${r.n}</span></span><div class="bar"><i style="width:${(r.v/mx*100).toFixed(1)}%"></i></div><span class="v">${r.known?esc(eur(r.v)):'prix ?'}</span></div>`).join('')||'<span class="meta">Rien de prévu ce mois-ci.</span>'}</div>`;
  $('#view').innerHTML=h;
}
function renderNext(){
  const t=today(),list=real(occ(t,addD(t,420))).filter(o=>!S.done[o.key]),k=mkey(t);
  const rows=S.acts.filter(a=>a.status!=='idee').map(a=>{const mine=list.filter(o=>o.a===a);return {a,n1:mine[0],n2:mine[1]}}).sort((x,y)=>(x.n1?x.n1.d:'9')<(y.n1?y.n1.d:'9')?-1:1);
  let h=`<h2>Quand je fais quoi</h2><table class="stack"><thead><tr><th>Activité</th><th>Prochaine fois</th><th>Dans</th><th>Et après</th><th class="num">Prix</th></tr></thead><tbody>`;
  h+=rows.map(({a,n1,n2})=>{
    const name=`<i class="dot" style="--c:${esc(a.color)}"></i><b>${esc(a.name)}</b>${a.status==='essai'?' <span class="pill">à tester</span>':''}${(n1&&n1.place)||a.place?`<br><span class="meta">${esc((n1&&n1.place)||a.place)}</span>`:''}`;
    if(a.rule&&a.rule.type==='flex'){const n=S.flexDone[a.id+'|'+k]||0;return `<tr><td>${name}</td><td>Quand je veux</td><td class="soon">${n}/${a.rule.per||1} ce mois</td><td>${esc(ruleText(a))}</td><td class="num">${esc(pTxt(a.price))}</td></tr>`}
    return `<tr><td>${name}</td><td>${n1?esc(fmtL(parse(n1.d)))+(n1.time?' · '+esc(n1.time):''):'Pas encore de date'}</td><td class="soon">${n1?esc(inDays(diff(t,parse(n1.d)))):''}</td><td>${n2?esc(fmtL(parse(n2.d))):''}</td><td class="num">${esc(pTxt(n1?n1.price:a.price))}</td></tr>`}).join('');
  h+='</tbody></table>';
  const ideas=S.acts.filter(a=>a.status==='idee');
  if(ideas.length)h+=`<h2>Pas encore commencé</h2><div class="legend" style="font-size:16px">${ideas.map(a=>`<span><i class="dot" style="--c:${esc(a.color)}"></i>${esc(a.name)}</span>`).join('')}</div><p class="hint">Quand tu te lances, appuie sur « + » un jour de la semaine et choisis-la.</p>`;
  $('#view').innerHTML=h;
}
const ST={actif:'Je le fais',essai:'À tester',idee:'Idée'};
function renderActs(){
  const card=a=>`<div class="card" style="--c:${esc(a.color)}"><h4><i class="dot"></i>${esc(a.name)}</h4><span class="pill">${ST[a.status]||''}</span><span>${esc(ruleText(a))}${a.time?' · '+esc(a.time):''}</span><span class="meta">${esc([pTxt(a.price)||'prix ?',a.place].filter(Boolean).join(' · '))}</span>${a.note?`<span class="meta">${esc(a.note)}</span>`:''}<button class="rb" data-edit="${esc(a.id)}">Modifier</button></div>`;
  let h=`<div class="nav"><div class="lbl"><b>Mes activités</b><span>Ajoute, change le rythme, le lieu ou le prix quand tu veux.</span></div><button class="rb go" data-add>+ Nouvelle</button></div>`;
  for(const s of ['actif','essai','idee']){const g=S.acts.filter(a=>a.status===s);if(g.length)h+=`<h2>${{actif:'Je le fais',essai:'À tester / observer',idee:'Idées, pas encore commencé'}[s]}</h2><div class="cards">${g.map(card).join('')}</div>`}
  h+=`<h2>Rotations</h2><p class="hint" style="margin:0 0 10px">Un même créneau qui change d'activité chaque semaine.</p><div class="cards">${S.rots.map(r=>`<div class="card"><h4>${esc(r.name)}</h4><span>Chaque ${DAYSL[r.day]}${r.every>1?', une semaine sur '+r.every:''}, depuis le ${esc(fmt(parse(r.start)))}</span><div class="seq">${r.items.map(id=>{const a=byId(id);return `<span style="--c:${esc(a?a.color:'#888')}">${esc(a?a.name:'Pause')}</span>`}).join('')}</div><button class="rb" data-rot="${esc(r.id)}">Modifier</button></div>`).join('')}</div><div class="line"><button class="rb" data-addrot>+ Nouvelle rotation</button></div>`;
  h+=`<h2>À explorer, sans pression</h2><ul class="todo">${S.todo.map(t=>`<li class="${t.done?'ok':''}"><input type="checkbox" data-todo="${esc(t.id)}" ${t.done?'checked':''} aria-label="Fait"><span>${esc(t.t)}</span><button class="rb" data-deltodo="${esc(t.id)}" aria-label="Supprimer">×</button></li>`).join('')}</ul><form class="line" id="todoF"><input id="todoI" placeholder="Ex. Tester un cours de pickleball" aria-label="Nouvelle idée à explorer" style="flex:1;min-width:200px"><button class="rb">Ajouter</button></form>`;
  h+=`<h2>Sauvegarde</h2><p class="hint" style="margin:0 0 10px" id="saveTxt">${esc(saveMsg)}</p><div class="line"><button class="rb go" data-dl>Télécharger une sauvegarde</button><label class="rb" style="display:inline-flex;align-items:center">Restaurer un fichier<input type="file" id="fileI" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px"></label><button class="rb" data-copy>Copier mes données</button><button class="rb" data-import>Coller des données</button></div><p class="hint">Pense à télécharger une sauvegarde de temps en temps : si tu vides les données du navigateur, le planning repart de zéro.</p><textarea id="impT" hidden placeholder="Colle ici des données copiées puis appuie sur Importer" aria-label="Données à importer" style="margin-top:8px"></textarea>`;
  $('#view').innerHTML=h;
}
function render(){renderStats();({week:renderWeek,month:renderMonth,next:renderNext,acts:renderActs})[view]();document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===view))}

let saveMsg='Enregistré uniquement sur ce téléphone, rien ne part sur internet.';
function setSave(m){saveMsg=m;const e=$('#saveTxt');if(e)e.textContent=m}
function save(){
  try{localStorage.setItem('planningFun',JSON.stringify(S))}catch(e){}
  render();
}

const F=$('#form'),sheet=$('#sheet');let rotDraft=null,addSel=null,curOcc=null;
const close=()=>{sheet.hidden=true;F.innerHTML='';F.dataset.kind=''};
const g=n=>F.elements.namedItem(n);
/* ajout rapide sur un jour */
function openAdd(day){
  addSel=null;F.dataset.kind='add';const d=day?parse(day):today();
  F.innerHTML=`<h3><small>Ajouter au planning</small>${esc(fmtL(d))}</h3>
<fieldset><legend>Quoi ?</legend><div class="chips" id="chips"></div></fieldset>
<label id="newL" hidden>Nom de la nouvelle activité<input name="nname" placeholder="Ex. Escalade" autocomplete="off"></label>
<div class="three"><label>Jour<input type="date" name="date" value="${iso(d)}"></label><label>Heure<input type="time" name="time"></label><label>Prix (€)<input type="number" name="price" min="0" step="0.5" inputmode="decimal" placeholder="—"></label></div>
<label>Lieu<input name="place" placeholder="Ex. Gymnase, Paris 14e" autocomplete="off"></label>
<fieldset><legend>Ça revient ?</legend><div class="pick">${[['once','Juste cette fois'],['1','Chaque semaine'],['2','1 sem. sur 2']].map(([v,t],i)=>`<label><input type="radio" name="rep" value="${v}"${i?'':' checked'}><span>${t}</span></label>`).join('')}</div></fieldset>
<p class="err" id="err" hidden></p>
<div class="acts"><button type="button" class="rb" data-close>Annuler</button><button class="rb go">Ajouter</button></div>`;
  drawChips();sheet.hidden=false;
}
function drawChips(){
  const on=S.acts.filter(a=>a.status!=='idee'),ideas=S.acts.filter(a=>a.status==='idee');
  $('#chips').innerHTML=on.concat(ideas).map(a=>`<button type="button" data-pick="${esc(a.id)}" aria-pressed="${addSel===a.id}"${a.status==='idee'?' class="idea"':''}>${esc(a.name)}</button>`).join('')+`<button type="button" data-pick="__new" aria-pressed="${addSel==='__new'}" class="idea">+ Nouvelle</button>`;
  $('#newL').hidden=addSel!=='__new';
}
function pickAct(id){
  addSel=id;drawChips();const a=byId(id);
  if(a){g('time').value=a.time||'';g('place').value=a.place||'';g('price').value=okP(a.price)?a.price:''}else{g('nname').focus()}
}
function submitAdd(){
  const err=$('#err');let a=byId(addSel);const date=g('date').value,rep=(F.querySelector('[name=rep]:checked')||{}).value||'once';
  if(!addSel){err.textContent='Choisis une activité (ou crée-en une nouvelle).';err.hidden=false;return}
  if(addSel==='__new'&&!g('nname').value.trim()){err.textContent='Donne un nom à la nouvelle activité.';err.hidden=false;return}
  if(!date){err.textContent='Choisis un jour.';err.hidden=false;return}
  const time=g('time').value,place=g('place').value.trim(),price=g('price').value===''?'':+g('price').value;
  if(!a){a={id:uid('a'),name:g('nname').value.trim(),color:COLORS[S.acts.length%COLORS.length],price,time,place,status:'actif',note:'',rule:{type:'none'}};S.acts.push(a)}
  else if(a.status==='idee')a.status='actif';
  if(rep==='once'){
    S.events.push({id:uid('e'),act:a.id,date,time,place,price});
    if(!a.time&&time)a.time=time;if(!a.place&&place)a.place=place;if(!okP(a.price)&&okP(price))a.price=price;
  }else{
    const every=+rep,day=wd(parse(date)),r=a.rule||{};
    if(r.type==='weekly'&&(r.every||1)===every&&r.start){if(!r.days.includes(day))r.days.push(day)}else a.rule={type:'weekly',days:[day],every,start:date};
    a.time=time;a.place=place;a.price=price;
  }
  close();save();
}
/* fiche d'une séance */
function openOcc(key,d){
  const o=occ(parse(d),parse(d)).find(x=>x.key===key);if(!o)return;curOcc=o;const a=o.a,done=!!S.done[key];
  F.dataset.kind='occ';
  F.innerHTML=`<h3 style="display:flex;gap:12px;align-items:center"><span class="av" style="--c:${esc(a.color)};position:relative">${esc(ini(a.name))}</span><span><small>${esc(fmtL(parse(o.d)))}</small>${esc(a.name)}</span></h3>
<div class="facts"><div><b>${esc(o.time||'—')}</b><span>Heure</span></div><div><b>${esc(pTxt(o.price)||'—')}</b><span>Prix</span></div><div><b style="font-size:14px;font-family:Nunito,sans-serif">${esc(o.place||'—')}</b><span>Lieu</span></div></div>
<div class="stack-b">
<button type="button" class="rb yl" data-oact="done">${done?'Finalement pas fait':'✓ C’est fait'}</button>
<button type="button" class="rb" data-oact="edit">${o.ev?'Modifier cette fois (heure, lieu, prix)':'Modifier l’activité (heure, lieu, prix, rythme)'}</button>
<button type="button" class="rb" data-oact="skip">Retirer juste cette fois</button>
${!o.ev&&!o.rot?'<button type="button" class="rb del" data-oact="stop">Ne plus la faire pour l’instant (la garder en idée)</button>':''}
</div>
<div class="acts"><button type="button" class="rb" data-close>Fermer</button></div>`;
  sheet.hidden=false;
}
function openEv(e){
  F.dataset.kind='ev';F.dataset.id=e.id;const a=byId(e.act);
  F.innerHTML=`<h3><small>Juste cette fois</small>${esc(a?a.name:'')}</h3>
<div class="three"><label>Jour<input type="date" name="date" value="${esc(e.date)}"></label><label>Heure<input type="time" name="time" value="${esc(e.time)}"></label><label>Prix (€)<input type="number" name="price" min="0" step="0.5" value="${esc(e.price)}"></label></div>
<label>Lieu<input name="place" value="${esc(e.place)}"></label>
<div class="acts"><button type="button" class="rb" data-close>Annuler</button><button class="rb go">Enregistrer</button></div>`;
  sheet.hidden=false;
}
/* fiche activité complète */
function openAct(id){
  const a=id?byId(id):{id:'',name:'',color:COLORS[S.acts.length%COLORS.length],price:'',time:'',place:'',status:'actif',note:'',rule:{type:'none'}};
  const r=Object.assign({type:'none',days:[],every:1,start:iso(today()),per:1,date:iso(today())},a.rule);
  F.dataset.kind='act';F.dataset.id=a.id;
  const opt=(list,cur)=>list.map(([v,t])=>`<option value="${v}"${String(cur)===String(v)?' selected':''}>${t}</option>`).join('');
  F.innerHTML=`<h3>${id?'Modifier':'Nouvelle activité'}</h3>
<label>Nom<input name="name" value="${esc(a.name)}" placeholder="Ex. Escalade" autocomplete="off"></label>
<fieldset><legend>Couleur</legend><div class="pick">${COLORS.map(c=>`<label><input type="radio" name="color" value="${c}"${c===a.color?' checked':''} aria-label="Couleur ${c}"><i style="background:${c}"></i></label>`).join('')}</div></fieldset>
<div class="two"><label>Prix par fois (€)<input name="price" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(a.price)}" placeholder="Pas encore"></label><label>Heure<input name="time" type="time" value="${esc(a.time)}"></label></div>
<label>Lieu<input name="place" value="${esc(a.place)}" placeholder="Ex. Gymnase, Paris 14e" autocomplete="off"></label>
<label>Statut<select name="status">${opt([['actif','Je le fais'],['essai','À tester / observer'],['idee','Idée, pas encore commencé']],a.status)}</select></label>
<label>Rythme<select name="type">${opt([['none','Pas de date fixe (j’ajoute au cas par cas)'],['weekly','Toutes les X semaines'],['monthly','Tous les X mois'],['flex','X fois par mois, quand je veux']],r.type==='once'?'none':r.type)}</select></label>
<fieldset data-show="weekly"><legend>Quel(s) jour(s)</legend><div class="pick">${DAYS.map((d,i)=>`<label><input type="checkbox" name="days" value="${i}"${r.days.includes(i)?' checked':''}><span>${d}</span></label>`).join('')}</div></fieldset>
<div class="two" data-show="weekly monthly"><label>Toutes les <span id="unit"></span><select name="every">${opt([1,2,3,4,6,8].map(n=>[n,n]),r.every)}</select></label><label>Première fois le<input type="date" name="start" value="${esc(r.start)}"></label></div>
<p class="hint" data-show="monthly">Même jour de la semaine à chaque fois (ex. le 4e samedi du mois).</p>
<label data-show="flex">Combien de fois par mois<input type="number" name="per" min="1" max="10" value="${esc(r.per)}"></label>
<label>Note<textarea name="note" placeholder="Lien, avec qui…">${esc(a.note)}</textarea></label>
<p class="err" id="err" hidden></p>
<div class="acts"><button type="button" class="rb" data-close>Annuler</button>${id?'<button type="button" class="rb del" data-del>Supprimer</button>':''}<button class="rb go">Enregistrer</button></div>`;
  showRule();sheet.hidden=false;
}
function showRule(){const t=g('type').value;F.querySelectorAll('[data-show]').forEach(e=>e.hidden=!e.dataset.show.split(' ').includes(t));const u=$('#unit');if(u)u.textContent=t==='monthly'?'… mois':'… semaines'}
function openRot(id){
  const r=id?S.rots.find(x=>x.id===id):{id:'',name:'Nouvelle rotation',day:5,every:1,start:iso(today()),items:[]};
  rotDraft=[...r.items];F.dataset.kind='rot';F.dataset.id=r.id;
  F.innerHTML=`<h3>${id?'Modifier la rotation':'Nouvelle rotation'}</h3>
<label>Nom<input name="name" value="${esc(r.name)}"></label>
<div class="two"><label>Jour<select name="day">${DAYSL.map((d,i)=>`<option value="${i}"${+r.day===i?' selected':''}>${d}</option>`).join('')}</select></label><label>Toutes les … semaines<select name="every">${[1,2,3,4].map(n=>`<option${+r.every===n?' selected':''}>${n}</option>`).join('')}</select></label></div>
<label>Première fois le<input type="date" name="start" value="${esc(r.start)}"></label>
<fieldset><legend>L'ordre, qui recommence en boucle</legend><div class="steps" id="steps"></div></fieldset>
<button type="button" class="rb" data-step>+ Ajouter une étape</button>
<div class="acts"><button type="button" class="rb" data-close>Annuler</button>${id?'<button type="button" class="rb del" data-del>Supprimer</button>':''}<button class="rb go">Enregistrer</button></div>`;
  drawSteps();sheet.hidden=false;
}
function drawSteps(){
  const o=id=>`<option value="pause"${id==='pause'?' selected':''}>Pause</option>`+S.acts.map(a=>`<option value="${esc(a.id)}"${a.id===id?' selected':''}>${esc(a.name)}</option>`).join('');
  $('#steps').innerHTML=rotDraft.map((id,i)=>`<div><select data-si="${i}" aria-label="Étape ${i+1}">${o(id)}</select><button type="button" class="rb" data-rm="${i}" aria-label="Retirer l'étape">×</button></div>`).join('')||'<p class="hint" style="margin:0">Aucune étape pour l’instant.</p>';
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){view=d.tab;render();try{window.scrollTo({top:0})}catch(x){}}
  else if(d.o){openOcc(d.o,d.d)}
  else if(d.addday!=null)openAdd(d.addday);
  else if(d.pick){pickAct(d.pick)}
  else if(d.oact){const o=curOcc;if(!o)return;
    if(d.oact==='done'){if(S.done[o.key])delete S.done[o.key];else S.done[o.key]=1;close();save()}
    else if(d.oact==='skip'){if(o.ev)S.events=S.events.filter(x=>x.id!==o.ev.id);else S.skip[o.key]=1;close();save()}
    else if(d.oact==='stop'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Sûr ? Retouche pour confirmer';return}o.a.status='idee';close();save()}
    else if(d.oact==='edit'){if(o.ev)openEv(o.ev);else openAct(o.a.id)}}
  else if(d.flex){const id=d.flex.split('|')[0],a=byId(id),per=(a&&a.rule.per)||1,n=S.flexDone[d.flex]||0;S.flexDone[d.flex]=n>=per?0:n+1;save()}
  else if(d.nav!=null){wk=+d.nav===0?monday(today()):addD(wk,7*d.nav);render()}
  else if(d.mnav!=null){mc=+d.mnav===0?new Date(today().getFullYear(),today().getMonth(),1):new Date(mc.getFullYear(),mc.getMonth()+ +d.mnav,1);render()}
  else if(d.edit)openAct(d.edit);
  else if(d.add!=null)openAct('');
  else if(d.rot)openRot(d.rot);
  else if(d.addrot!=null)openRot('');
  else if(d.close!=null)close();
  else if(d.step!=null){rotDraft.push(S.acts[0]?S.acts[0].id:'pause');drawSteps()}
  else if(d.rm!=null){rotDraft.splice(+d.rm,1);drawSteps()}
  else if(d.del!=null){
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Sûr ? Retouche pour supprimer';return}
    const id=F.dataset.id;
    if(F.dataset.kind==='act'){S.acts=S.acts.filter(a=>a.id!==id);S.rots.forEach(r=>r.items=r.items.filter(x=>x!==id));S.events=S.events.filter(x=>x.act!==id)}else S.rots=S.rots.filter(r=>r.id!==id);
    close();save();
  }
  else if(d.deltodo){S.todo=S.todo.filter(x=>x.id!==d.deltodo);save()}
  else if(d.dl!=null){try{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='planning-sauvegarde-'+iso(today())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);setSave('Sauvegarde téléchargée.')}catch(x){setSave('Téléchargement impossible ici : utilise « Copier mes données ».')}}
  else if(d.copy!=null){try{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>setSave('Données copiées : colle-les dans une note pour les garder.'),()=>setSave('Copie refusée par le navigateur.'))}catch(x){setSave('Copie refusée par le navigateur.')}}
  else if(d.import!=null){const t=$('#impT');if(t.hidden){t.hidden=false;t.focus();return}try{const v=JSON.parse(t.value);if(!Array.isArray(v.acts))throw 0;S=fix(v);save();setSave('Données importées.')}catch(err){setSave('Ces données ne sont pas lisibles.')}}
});
document.addEventListener('change',e=>{
  if(e.target.name==='type'&&F.contains(e.target))showRule();
  if(e.target.id==='fileI'&&e.target.files[0]){e.target.files[0].text().then(t=>{try{const v=JSON.parse(t);if(!Array.isArray(v.acts))throw 0;S=fix(v);save();setSave('Sauvegarde restaurée.')}catch(x){setSave('Ce fichier n\u2019est pas une sauvegarde du planning.')}})}
  if(e.target.dataset.si!=null)rotDraft[+e.target.dataset.si]=e.target.value;
  if(e.target.dataset.todo){const t=S.todo.find(x=>x.id===e.target.dataset.todo);if(t){t.done=e.target.checked;save()}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='todoF'){const v=$('#todoI').value.trim();if(v){S.todo.push({id:uid('t'),t:v,done:false});save();const i=$('#todoI');if(i)i.focus()}return}
  if(e.target!==F)return;const k=F.dataset.kind,err=$('#err');
  if(k==='add')return submitAdd();
  if(k==='ev'){const ev=S.events.find(x=>x.id===F.dataset.id);if(ev){ev.date=g('date').value||ev.date;ev.time=g('time').value;ev.place=g('place').value.trim();ev.price=g('price').value===''?'':+g('price').value}close();save();return}
  if(k==='act'){
    const name=g('name').value.trim(),type=g('type').value,days=[...F.querySelectorAll('[name=days]:checked')].map(x=>+x.value),st=g('status').value;
    const bad=!name?'Donne un nom à l’activité.':(type==='weekly'&&st!=='idee'&&!days.length)?'Choisis au moins un jour.':'';
    if(bad){err.textContent=bad;err.hidden=false;return}
    const c=F.querySelector('[name=color]:checked');
    const a={id:F.dataset.id||uid('a'),name,color:c?c.value:COLORS[0],price:g('price').value===''?'':+g('price').value,time:g('time').value,place:g('place').value.trim(),status:st,note:g('note').value.trim(),
      rule:{type,days,every:+g('every').value||1,start:g('start').value||iso(today()),per:+g('per').value||1}};
    const i=S.acts.findIndex(x=>x.id===a.id);if(i>=0)S.acts[i]=a;else S.acts.push(a);
  }else if(k==='rot'){
    const r={id:F.dataset.id||uid('r'),name:g('name').value.trim()||'Rotation',day:+g('day').value,every:+g('every').value||1,start:g('start').value||iso(today()),items:rotDraft.slice()};
    const i=S.rots.findIndex(x=>x.id===r.id);if(i>=0)S.rots[i]=r;else S.rots.push(r);
  }
  close();save();
});
sheet.addEventListener('click',e=>{if(e.target===sheet)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)close()});

render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
</script>
